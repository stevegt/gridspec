scenarios:
  - spec_id: scenario.specdot.clean
    covers:
      - scenario.clean.request
      - scenario.clean.load
      - scenario.clean.validate
      - scenario.clean.report
      - scenario.clean.result
      - scenario.flow.clean.request.load
      - scenario.flow.clean.load.validate
      - scenario.flow.clean.validate.report
      - scenario.flow.clean.report.result
    go_test:
      package: ./internal/app
      test: TestVetSelfSpecificationBuildReady
      timeout: 30s

  - spec_id: scenario.specdot.findings
    covers:
      - scenario.findings.request
      - scenario.findings.parse
      - scenario.findings.diagnose
      - scenario.findings.report
      - scenario.findings.result
      - scenario.flow.findings.request.parse
      - scenario.flow.findings.parse.diagnose
      - scenario.flow.findings.diagnose.report
      - scenario.flow.findings.report.result
    go_test:
      package: ./internal/app
      test: TestVetCatchesCarMisfireClass
      timeout: 30s

  - spec_id: scenario.specdot.config_failure
    covers:
      - scenario.config.request
      - scenario.config.load
      - scenario.config.stderr
      - scenario.config.result
      - scenario.flow.config.request.load
      - scenario.flow.config.load.stderr
      - scenario.flow.config.stderr.result
    go_test:
      package: ./internal/app
      test: TestVetLegacyConfigFailure
      timeout: 30s

  - spec_id: scenario.specdot.emit_failure
    covers:
      - scenario.emit.request
      - scenario.emit.seal
      - scenario.emit.write
      - scenario.emit.retain
      - scenario.emit.result
      - scenario.flow.emit.request.seal
      - scenario.flow.emit.seal.write
      - scenario.flow.emit.write.retain
      - scenario.flow.emit.retain.result
    go_test:
      package: ./internal/app
      test: TestVetLegacyEmitFailure
      timeout: 30s

  - spec_id: scenario.specdot.required_inconclusive
    covers:
      - scenario.inconclusive.request
      - scenario.inconclusive.explore
      - scenario.inconclusive.exhaust
      - scenario.inconclusive.diagnose
      - scenario.inconclusive.result
      - scenario.flow.inconclusive.request.explore
      - scenario.flow.inconclusive.explore.exhaust
      - scenario.flow.inconclusive.exhaust.diagnose
      - scenario.flow.inconclusive.diagnose.result
    go_test:
      package: ./internal/checker
      test: TestRequiredHistorySemanticsAreInconclusive
      timeout: 30s

  - spec_id: scenario.specdot.repeat
    covers:
      - scenario.repeat.request
      - scenario.repeat.first
      - scenario.repeat.second
      - scenario.repeat.compare
      - scenario.repeat.result
      - scenario.flow.repeat.request.first
      - scenario.flow.repeat.first.second
      - scenario.flow.repeat.second.compare
      - scenario.flow.repeat.compare.result
    go_test:
      package: ./internal/app
      test: TestEmittedIRIsDeterministic
      timeout: 30s

  - spec_id: scenario.specdot.conform.clean
    covers:
      - scenario.conform.request
      - scenario.conform.validate.spec
      - scenario.conform.resolve.bindings
      - scenario.conform.execute.scenarios
      - scenario.conform.compare.coverage
      - scenario.conform.result
      - scenario.flow.conform.request.validate
      - scenario.flow.conform.validate.bind
      - scenario.flow.conform.bind.execute
      - scenario.flow.conform.execute.compare
      - scenario.flow.conform.compare.result
    go_test:
      package: ./internal/conform
      test: TestRunRequiresEvidenceOrExplicitExclusion
      timeout: 30s

  - spec_id: scenario.gridspec.qualification.smoke
    covers:
      - gridspec.qualification.smoke.start
      - gridspec.qualification.smoke.done
      - gridspec.qualification.smoke.flow
    command:
      artifact: gridspec
      args: [version]
      fixture: testdata/qualification-empty
      timeout: 5s
      repeat: 2
    expect:
      exit_code: 0
      stdout: {equals: "gridspec dev\n"}
      stderr: {empty: true}

exclusions:
  - reason: Authority-flow edges are relationships covered by the bound transaction, replay, vet, proposal, acceptance, and commit objects.
    spec_ids:
      - gridspec.flow.transaction.replay
      - gridspec.flow.replay.materialize
      - gridspec.flow.materialize.vet
      - gridspec.flow.vet.proposal
      - gridspec.flow.proposal.decision
      - gridspec.flow.proposal.preview
      - gridspec.flow.decision.accept
      - gridspec.flow.decision.reject
      - gridspec.flow.accepted.outputs

  - reason: Description-flow edges are relationships covered by the bound selection, generation, audit, and proposal objects and focused tests.
    spec_ids:
      - gridspec.describe.flow.accepted.select
      - gridspec.describe.flow.select.complete
      - gridspec.describe.flow.complete.noop
      - gridspec.describe.flow.complete.request
      - gridspec.describe.flow.request.validate
      - gridspec.describe.flow.request.failure
      - gridspec.describe.flow.validate.audit
      - gridspec.describe.flow.validate.failure
      - gridspec.describe.flow.audit.transaction
      - gridspec.describe.flow.audit.failure
      - gridspec.describe.flow.transaction.proposal
      - gridspec.describe.flow.transaction.failure

  - reason: Architecture decisions constrain the implementation but intentionally have no one-to-one Go object.
    spec_ids:
      - decision.specdot.bootstrap
      - decision.bootstrap.authority
      - decision.bootstrap.go
      - decision.bootstrap.self_spec
      - decision.bootstrap.conformance
      - decision.bootstrap.future_build
      - decision.edge.bootstrap.implementation
      - decision.edge.bootstrap.dogfood
      - decision.edge.bootstrap.conformance
      - decision.edge.bootstrap.generation

  - reason: Checker flow edges are internal branches covered through bound checker functions and focused tests rather than standalone symbols.
    spec_ids:
      - flow.checker.input.enumerate
      - flow.checker.none
      - flow.checker.machine
      - flow.checker.initialize.support
      - flow.checker.supported
      - flow.checker.unsupported
      - flow.checker.safety.violation
      - flow.checker.bound
      - flow.checker.safety.complete
      - flow.checker.liveness.violation
      - flow.checker.liveness.passed
      - flow.checker.liveness.assumed
      - flow.checker.trace.violated
      - flow.checker.passed.collect
      - flow.checker.violated.collect
      - flow.checker.inconclusive.collect
      - flow.checker.assumed.collect
      - flow.checker.unchecked.output
      - flow.checker.collect.more
      - flow.checker.collect.done

  - reason: Conformance flow edges describe branch semantics implemented inside the bound orchestration functions and exercised by engine tests.
    spec_ids:
      - flow.conform.request.sidecar
      - flow.conform.sidecar.loaded
      - flow.conform.sidecar.failure
      - flow.conform.vet.clean
      - flow.conform.vet.findings
      - flow.conform.symbols.resolved
      - flow.conform.symbols.mismatch
      - flow.conform.artifacts.built
      - flow.conform.artifacts.failure
      - flow.conform.scenarios.passed
      - flow.conform.scenarios.failed
      - flow.conform.evidence.coverage
      - flow.conform.coverage.met
      - flow.conform.coverage.missing
      - flow.conform.baseline.matched
      - flow.conform.baseline.regressed
      - flow.conform.report.clean
      - flow.conform.report.failure

  - reason: These nominal scalar and collection declarations currently use Go primitives or slices and therefore have no stable named Go object.
    spec_ids:
      - type.invocation.id
      - type.artifact.id
      - type.filesystem.path
      - type.filesystem.path.list
      - type.report.format
      - type.exit.code
      - type.source.list
      - type.parsed.module
      - type.ir.graph.list
      - type.ir.contract.list
      - type.ir.binding.list
      - type.diagnostic.list
      - type.check.run.list

  - reason: Data relationships are structural IR constraints verified by vet and do not correspond to standalone implementation symbols.
    spec_ids:
      - relationship.module.sources
      - relationship.ir.sources
      - relationship.ir.graphs
      - relationship.ir.contracts
      - relationship.ir.bindings
      - relationship.ir.checks
      - relationship.output.ir
      - relationship.report.diagnostics
      - relationship.result.diagnostics
      - relationship.sidecar.implementation
      - relationship.baseline.conformance

  - reason: Promise and agent declarations specify the operator protocol and authority boundary rather than in-process Go objects.
    spec_ids:
      - agent.operator
      - agent.specdot
